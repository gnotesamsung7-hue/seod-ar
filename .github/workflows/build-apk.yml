name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK is already installed on GitHub's ubuntu runners (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SEOD-AR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SEOD-AR-apk
          path: SEOD-AR.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SEOD AR app ${{ github.run_number }}
          body: Install SEOD-AR.apk on the phone (allow "install unknown apps" when asked).
          files: SEOD-AR.apk
          make_latest: true
