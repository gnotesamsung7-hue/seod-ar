plugins {
    id 'com.android.application'
}

android {
    namespace 'com.markdave.seodar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.markdave.seodar'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
